name: Release

# Builds BambuWidget-android.apk and BambuWidget-windows.zip and publishes them as a GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or when release notes are pushed: then the version comes from
# windows/package.json and the release (and its tag) is created once, if docs/release-notes/v<version>.md exists.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['docs/release-notes/**', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(jq -r .version windows/package.json)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ ! -f "docs/release-notes/$tag.md" ]; then
            echo "::notice::No docs/release-notes/$tag.md, nothing to release."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" != tag ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android build tools
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt android-sdk-platform-23 dalvik-exchange apksigner zipalign

      - name: Signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/release.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a new key and cannot update an installed copy signed with another key."
          fi

      - name: Build APK
        if: steps.version.outputs.skip != 'true'
        env:
          BW_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'bambuwidget-temporary' }}
        run: |
          android/build.sh
          cp android/build/BambuWidget.apk BambuWidget-android.apk

      - name: Windows zip
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist && cp -r windows dist/BambuWidget
          (cd dist && zip -qr ../BambuWidget-windows.zip BambuWidget)

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bambu Widget ${{ steps.version.outputs.tag }}
          body_path: docs/release-notes/${{ steps.version.outputs.tag }}.md
          make_latest: true
          files: |
            BambuWidget-android.apk
            BambuWidget-windows.zip
