name: Upload signed APK (one-off)

# Temporary: replaces the APK of release v1.1.0 with the copy signed with the app's release key.
on:
  push:
    paths: ['release-upload/**', '.github/workflows/upload-apk.yml']

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Bambu Widget v1.1.0
          body_path: docs/release-notes/v1.1.0.md
          files: release-upload/BambuWidget-android.apk
          overwrite_files: true
