name: Upload signed APK (one-off)

# Temporary: replaces the APK of release v1.1.0 with the copy signed with the app's release key.
on:
  push:
    paths: ['release-upload/**', '.github/workflows/upload-apk.yml']

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.0 release-upload/BambuWidget-android.apk --clobber --repo "$GITHUB_REPOSITORY"
